name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.json'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        working-directory: ./Tarslauncher
        run: chmod +x gradlew

      - name: Build Debug APK and Run Unit Tests
        working-directory: ./Tarslauncher
        run: ./gradlew assembleDebug test --stacktrace
