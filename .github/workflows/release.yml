name: Build and Release TARS Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version_tag || '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Release Tag
        run: bash .github/scripts/validate-release-tag.sh validate "$RELEASE_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode Release Keystore from GitHub Secrets
        working-directory: ./Tarslauncher
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > tarslauncher-release.jks
            echo "Release keystore successfully decoded from GitHub Secrets."
          else
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is not set in repository settings!" && exit 1
          fi

      - name: Grant execute permission for gradlew
        working-directory: ./Tarslauncher
        run: chmod +x gradlew

      - name: Build Release APK and Run Unit Tests
        working-directory: ./Tarslauncher
        env:
          RELEASE_STORE_FILE: "tarslauncher-release.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "Error: $name is not configured for the release build."
              exit 1
            fi
          done
          ./gradlew assembleRelease testReleaseUnitTest --stacktrace

      - name: Locate, Rename APK and Generate SHA-256 Checksum
        working-directory: ./Tarslauncher
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found! Looking in all build outputs:"
            find app/build/outputs/ -name "*.apk"
            APK_PATH=$(find app/build/outputs/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" TarsLauncher-release.apk
          sha256sum TarsLauncher-release.apk > TarsLauncher-release.apk.sha256
          APK_HASH=$(cut -d ' ' -f 1 TarsLauncher-release.apk.sha256)
          echo "APK_SHA256=$APK_HASH" >> $GITHUB_ENV
          echo "Generated SHA-256: $APK_HASH"

      - name: Validate APK Version
        if: env.RELEASE_TAG != ''
        run: |
          python3 - <<'PY'
          import json, os
          with open('Tarslauncher/app/build/outputs/apk/release/output-metadata.json') as f:
              apk = json.load(f)['elements'][0]
          assert os.environ['RELEASE_TAG'] == f"v{apk['versionName']}", 'Release tag does not match APK version'
          PY

      - name: Create or Update GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          BODY_FILE="$RUNNER_TEMP/release-notes.md"
          cat release-notes.md > "$BODY_FILE"
          printf '\n### SHA-256 Checksum\n`sha256: %s`\n' "$APK_SHA256" >> "$BODY_FILE"
          gh release create "$TAG" \
            ./Tarslauncher/TarsLauncher-release.apk \
            ./Tarslauncher/TarsLauncher-release.apk.sha256 \
            --title "TARS Launcher $TAG" \
            --verify-tag \
            --notes-file "$BODY_FILE" \
            --generate-notes

      - name: Update version.json with Release Hash and Push to main
        if: env.RELEASE_TAG != ''
        run: |
          python3 - <<'PY'
          import json, os
          with open('version.json', 'r') as f:
              data = json.load(f)
          with open('Tarslauncher/app/build/outputs/apk/release/output-metadata.json') as f:
              apk = json.load(f)['elements'][0]
          data['versionCode'] = apk['versionCode']
          with open('release-notes.md') as f:
              data['releaseNotes'] = f.read().strip()
          data['sha256'] = os.environ.get('APK_SHA256', '')
          apk_file = './Tarslauncher/TarsLauncher-release.apk'
          if os.path.exists(apk_file):
              data['apkSize'] = os.path.getsize(apk_file)
          tag_name = os.environ['RELEASE_TAG'][1:]
          if tag_name:
              data['versionName'] = tag_name
              data['downloadUrl'] = f'https://github.com/Tarkys666/Tarslauncher/releases/download/v{tag_name}/TarsLauncher-release.apk'
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=4)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || (git commit -m "chore(release): update version.json for $RELEASE_TAG [skip ci]" && git push origin HEAD:main)

      - name: Clean up Decoded Keystore
        if: always()
        working-directory: ./Tarslauncher
        run: rm -f tarslauncher-release.jks
