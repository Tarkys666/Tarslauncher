name: Build and Release TARS Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify Keystore
        working-directory: ./Tarslauncher
        run: |
          if [ -f tarslauncher-release.jks ]; then
            echo "Permanent repository keystore verified: tarslauncher-release.jks"
          else
            echo "Error: tarslauncher-release.jks missing!" && exit 1
          fi

      - name: Grant execute permission for gradlew
        working-directory: ./Tarslauncher
        run: chmod +x gradlew

      - name: Run Unit Tests
        working-directory: ./Tarslauncher
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Release APK
        working-directory: ./Tarslauncher
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename APK
        working-directory: ./Tarslauncher
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found! Looking in all build outputs:"
            find app/build/outputs/ -name "*.apk"
            APK_PATH=$(find app/build/outputs/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" TarsLauncher-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version_tag != ''
        with:
          name: TARS Launcher ${{ github.ref_name || github.event.inputs.version_tag }}
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag }}
          files: ./Tarslauncher/TarsLauncher-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
