<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Elmas</title>
<style>
:root{--bg:#000000;--fg:#8fa6cf;box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;padding:0;background:#000000;color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000000}
canvas{flex:1;width:100%;height:100%;min-height:0;display:block;touch-action:none}
p{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const CELLW=4,CELLH=6,CW=CELLW/CELLH;
let cols=100,rows=50,Wd=0,Hd=0,offX=0,offY=0,id,u32,zN,zF,idN,idF,nz;

/* 3x5 bitmap glyphs: ramp ' .:-=+*#%@' then '-' arm(10) '|' arm(11) star(12) */
const GL=[[0,0,0,0,0],[0,0,0,0,2],[0,2,0,2,0],[0,0,7,0,0],[0,7,0,7,0],[0,2,7,2,0],[5,2,7,2,5],[5,7,5,7,5],[5,1,2,4,5],[7,5,7,4,7],[0,0,7,0,0],[2,2,2,2,2],[5,2,7,2,5]];

/* ---- Brilliant-cut geometry ---- */
const V=[];
const add=(x,y,z)=>V.push([x,y,z])-1;
const ring=(n,r,y)=>{const a=[];for(let i=0;i<n;i++){const t=i*Math.PI*2/n;a.push(add(Math.cos(t)*r,y,Math.sin(t)*r));}return a;};
const T=ring(8,0.56,0.5),G=ring(16,1,0.2),L=ring(8,0.5,-0.5),C=add(0,-0.95,0);
const tri=[];
const addT=(a,b,c)=>tri.push({v:[a,b,c]});
for(let i=1;i<7;i++)addT(T[0],T[i],T[i+1]);
for(let i=0;i<8;i++){
  const n=(i+1)%8,gm=G[(2*i+15)%16],g0=G[2*i],gp=G[2*i+1];
  addT(T[i],T[n],gp);addT(T[i],gm,g0);addT(T[i],g0,gp);
  addT(L[i],gm,g0);addT(L[i],g0,gp);addT(L[i],L[n],gp);addT(C,L[i],L[n]);
}
const ctr=[0,-0.2,0];
tri.forEach(f=>{
  const [a,b,c]=f.v.map(k=>V[k]);
  const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];
  const l=Math.hypot(...n)||1;n=n.map(x=>x/l);
  const m=[(a[0]+b[0]+c[0])/3-ctr[0],(a[1]+b[1]+c[1])/3-ctr[1],(a[2]+b[2]+c[2])/3-ctr[2]];
  if(n[0]*m[0]+n[1]*m[1]+n[2]*m[2]<0)n=n.map(x=>-x);
  f.n=n;
});

/* ---- Environment ---- */
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};
const LT=[[.5,.7,.5],[-.6,.5,.6],[.1,-.3,.95],[.8,.1,.3],[-.3,.9,-.2],[-.8,-.2,.4],[0,.2,1],[.3,-.8,.5]].map(nrm);
function env(r,t){
  const c=Math.cos(t*.3),s=Math.sin(t*.3);
  const x=r[0]*c+r[2]*s,z=-r[0]*s+r[2]*c,y=r[1];
  let e=0;
  for(const l of LT){const d=x*l[0]+y*l[1]+z*l[2];if(d>0.93)e+=Math.pow((d-0.93)*14.3,2)*1.3;}
  const b=Math.sin(x*7+Math.sin(y*4+t*.4)*2)*Math.sin(y*6-z*3+t*.2);
  if(b>0.55)e+=(b-0.55)*1.7;
  return e;
}
const h2=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const HR=[];for(let h=0;h<360;h++){const f=n=>{const k=(n+h/30)%12;return .6-.4*Math.max(-1,Math.min(k-3,9-k,1))};HR.push([f(0),f(8),f(4)]);}
const KEY=nrm([-.4,.7,.6]);
const pack=(r,g,b)=>(255<<24)|((b*255|0)<<16)|((g*255|0)<<8)|(r*255|0);

/* ---- Sizing: ~100k+ cells ---- */
function resize(){
  const W=cv.clientWidth,H=cv.clientHeight;
  const de=Math.min(window.devicePixelRatio||1,Math.sqrt(3.84e6/(W*H)));
  Wd=Math.max(16,Math.floor(W*de));Hd=Math.max(16,Math.floor(H*de));
  cv.width=Wd;cv.height=Hd;
  cols=Math.floor(Wd/CELLW);rows=Math.floor(Hd/CELLH);
  offX=(Wd-cols*CELLW)>>1;offY=(Hd-rows*CELLH)>>1;
  id=ctx.createImageData(Wd,Hd);u32=new Uint32Array(id.data.buffer);
  const n=cols*rows;
  zN=new Float32Array(n);zF=new Float32Array(n);idN=new Int16Array(n);idF=new Int16Array(n);nz=new Float32Array(n);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)nz[y*cols+x]=h2(x,y);
}
addEventListener("resize",resize);

let yawOff=0,pitOff=0,drag=false,lx=0,ly=0;
cv.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener("pointermove",e=>{if(!drag)return;yawOff+=(e.clientX-lx)*0.012;pitOff=Math.max(-0.5,Math.min(0.6,pitOff+(e.clientY-ly)*0.006));lx=e.clientX;ly=e.clientY});
const up=()=>{drag=false;};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

function put(cx,cy,g,c){
  if(cx<0||cy<0||cx>=cols||cy>=rows)return;
  const gl=GL[g],bx=offX+cx*CELLW,by=offY+cy*CELLH;
  for(let r=0;r<5;r++){const b=gl[r];if(!b)continue;const o=(by+r)*Wd+bx;
    if(b&4)u32[o]=c;if(b&2)u32[o+1]=c;if(b&1)u32[o+2]=c;}
}

let ang=0,last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  ang+=dt*(drag?0.15:0.55);
  render(now/1000);
  requestAnimationFrame(frame);
}
function render(t){
  u32.fill(0xFF000000);
  zN.fill(-1e9);zF.fill(1e9);idN.fill(-1);idF.fill(-1);
  const yaw=ang+yawOff,pit=0.42+pitOff+Math.sin(t*.5)*0.07;
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
  const rot=v=>{const x1=v[0]*cy+v[2]*sy,z1=-v[0]*sy+v[2]*cy;return[x1,v[1]*cp-z1*sp,v[1]*sp+z1*cp]};
  const S=Math.min(rows*0.5,cols*CW*0.42),cx=cols/2,cyy=rows/2;
  const P=V.map(v=>{const r=rot(v);return[cx+r[0]*S/CW,cyy-(r[1]+0.2)*S,r[2]]});
  const NR=tri.map(f=>rot(f.n));
  // per-face lighting (faces are flat -> computed once per face)
  const eT=[],dT=[],hT=[];
  NR.forEach((nn,i)=>{
    const rr=[2*nn[2]*nn[0],2*nn[2]*nn[1],2*nn[2]*nn[2]-1];
    eT.push(env(rr,t));
    dT.push(Math.max(0,nn[0]*KEY[0]+nn[1]*KEY[1]+nn[2]*KEY[2]));
    hT.push((((rr[0]*200+rr[1]*160+t*25+i*17)%360)+360)%360|0);
  });
  tri.forEach((f,i)=>{
    const [a,b,c]=f.v.map(k=>P[k]);
    const den=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
    if(Math.abs(den)<1e-6)return;
    const front=NR[i][2]>0;
    const x0=Math.max(0,Math.floor(Math.min(a[0],b[0],c[0]))),x1=Math.min(cols-1,Math.ceil(Math.max(a[0],b[0],c[0])));
    const y0=Math.max(0,Math.floor(Math.min(a[1],b[1],c[1]))),y1=Math.min(rows-1,Math.ceil(Math.max(a[1],b[1],c[1])));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const px=x+.5,py=y+.5;
      const w0=((b[1]-c[1])*(px-c[0])+(c[0]-b[0])*(py-c[1]))/den;
      const w1=((c[1]-a[1])*(px-c[0])+(a[0]-c[0])*(py-c[1]))/den;
      const w2=1-w0-w1;
      if(w0<-1e-4||w1<-1e-4||w2<-1e-4)continue;
      const z=w0*a[2]+w1*b[2]+w2*c[2],k=y*cols+x;
      if(front){if(z>zN[k]){zN[k]=z;idN[k]=i}}else if(z<zF[k]){zF[k]=z;idF[k]=i}
    }
  });
  const spark=[];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const k=y*cols+x,a=idN[k],hv=nz[k];
    if(a>=0){
      const b=idF[k],eF=eT[a],eB=b>=0?eT[b]:0;
      let lum=0.08+0.14*dT[a]+0.45*eF+0.6*eB+hv*0.05;
      const rI=x+1<cols?idN[k+1]:-1,dI=y+1<rows?idN[k+cols]:-1;
      if(rI!==a||dI!==a)lum+=0.26;
      const l=lum>1?1:lum;
      const sm=Math.min(1,eB*1.3+eF*0.6)*0.9,hc=HR[hT[a]];
      const br=0.22+0.78*l,w=Math.max(0,l-0.7)*2.2;
      let r=(0.5*(1-sm)+hc[0]*sm)*br,g=(0.68*(1-sm)+hc[1]*sm)*br,bl=(1*(1-sm)+hc[2]*sm)*br;
      r+=w*(1-r);g+=w*(1-g);bl+=w*(1-bl);
      put(x,y,lum<0.14?1:Math.min(9,Math.floor(l*9.99)),pack(r,g,bl));
      if(lum>1.05)spark.push(x,y);
    }else{
      const dx=(x-cx)*CW,dy=y-cyy,dd=Math.hypot(dx,dy)/(S*1.35);
      const g=Math.max(0,1-dd),gl=g*g*0.32;
      if(hv<gl*0.9){const q=0.1+gl*0.9;put(x,y,hv<gl*0.3?2:1,pack(q*.35,q*.55,q));}
      else if(hv>0.9975){const tw=0.5+0.5*Math.sin(t*3+hv*9000);if(tw>0.5)put(x,y,tw>0.92?5:1,pack(.2+tw*.3,.3+tw*.4,.4+tw*.55));}
    }
  }
  // sparkle stars
  const tk=Math.floor(t*6),W=pack(1,1,1),Wd2=pack(.7,.85,1);
  for(let i=0;i<spark.length;i+=2){
    const x=spark[i],y=spark[i+1];
    if(h2(x+tk*3.1,y-tk)>0.05)continue;
    const big=h2(y,x+tk)>0.5,ar=big?7:4;
    for(let j=1;j<=ar;j++){const c=j<3?W:Wd2;put(x-j,y,10,c);put(x+j,y,10,c);}
    for(let j=1;j<=(big?5:3);j++){put(x,y-j,11,Wd2);put(x,y+j,11,Wd2);}
    put(x,y,12,W);
  }
  ctx.putImageData(id,0,0);
}
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
